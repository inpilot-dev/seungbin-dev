name: telegram
description: 알림 한 통 — 디스코드 웹후크(기본)·텔레그램·둘 다 (2026-10-28 디스코드 이전, 이름은 호출처를 안 건드리려 그대로). 값이 없으면 조용히 생략한다 — 알림은 부가가치지 전제가 아니다.
inputs:
  webhook: { description: "DISCORD_WEBHOOK_URL — secret 으로만 넘긴다. 주소 자체가 쓰기 권한이다", required: false, default: "" }
  channel: { description: "NOTIFY_CHANNEL — discord(비면 이것)·telegram·both. 저장소 변수 vars.NOTIFY_CHANNEL", required: false, default: "" }
  token: { description: "TELEGRAM_BOT_TOKEN (telegram·both)", required: false, default: "" }
  chat: { description: "TELEGRAM_CHAT_ID (telegram·both)", required: false, default: "" }
  text: { description: "보낼 문장", required: true }
runs:
  using: composite
  steps:
    # 값은 with: → env 로만 흐른다 — 셸 명령줄·set -x 에 끼지 않는다. 나누기·429·멘션 끔·비노출은 scripts/notify.py(--selftest)
    - shell: bash
      env:
        DISCORD_WEBHOOK_URL: ${{ inputs.webhook }}
        NOTIFY_CHANNEL: ${{ inputs.channel }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.token }}
        TELEGRAM_CHAT_ID: ${{ inputs.chat }}
        NOTIFY_TEXT: ${{ inputs.text }}
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/notify.py"
