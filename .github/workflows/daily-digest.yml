name: daily-digest

# 매일 새벽 3시(KST) AI·개발 소식을 모아 digest/<날짜> 브랜치에 커밋한다.
#
# 2026-09-16: PR 생성을 멈췄다. "체크 + 논평" 수동 발행 경로는 한 번도 안 썼고
# (실발행은 전부 auto-post 의 grade.py 경로) PR 만 7개 쌓였다. 브랜치는 남긴다 —
# auto-post.yml 의 "Fetch latest digest branch" 가 이걸 읽어 주제를 고른다.
#
# ⚠️ 최초 1회 설정 필요: 로컬에서 `claude setup-token` 실행 → 나온 토큰을
#    Settings → Secrets → Actions 에 CLAUDE_CODE_OAUTH_TOKEN 으로 등록.
#    요약이 API 과금 없이 Claude 구독으로 돈다. (없으면 요약만 생략되고 수집은 정상)
on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Self-check collector
        run: python scripts/collect_digest.py --selftest

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Collect digest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/collect_digest.py

      # X 핵심 추출 — 같은 PR 에 digest/x-<날짜>.md 로 실린다.
      # X_BEARER_TOKEN(종량제 API v2) 이 없으면 syndication+Bluesky 폴백. 실패해도 digest 는 산다.
      - name: X core
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/x_core.py

      - name: Push digest branch
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain digest/)" ]; then
            echo "신규 항목 없음 — 커밋 생략"
            exit 0
          fi
          DATE=$(TZ=Asia/Seoul date +%F)
          BRANCH="digest/$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add digest/
          git commit -m "chore(digest): $DATE 수집"
          git push -u origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # ponytail: 브랜치가 유일한 저장소라 지우면 그날 수집은 사라진다.
      # auto-post 는 최신 1개만 읽으므로 14일이면 충분하다. 더 길게 보관할 일이
      # 생기면 CUTOFF 날짜만 바꾼다.
      #
      # 오늘치를 실제로 푸시했을 때만 지운다. collect_digest 는 전부 실패해도
      # "신규 항목 없음" 으로 성공 종료하므로, 이 조건이 없으면 브랜치를 안 만든 날에도
      # 삭제가 돌고 14일 연속이면 저장소가 비어 auto-post 가 재료를 잃는다.
      - name: Prune digest branches older than 14 days
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUTOFF="digest/$(TZ=Asia/Seoul date -d '14 days ago' +%F)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' \
            | { grep '^digest/[0-9]' || true; } | awk -v c="$CUTOFF" '$0 < c' \
            | while read -r b; do
                # 하나가 실패해도(권한·이미 삭제됨) 나머지는 계속 지운다. 조용히 멈추지 않게 알린다.
                if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b"; then
                  echo "삭제: $b"
                else
                  echo "::warning title=브랜치 삭제 실패::$b"
                fi
              done
