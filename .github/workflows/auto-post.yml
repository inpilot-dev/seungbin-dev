name: auto-post

# 주간 큐를 채운다 (증분 2, 2026-09-18). 머지는 사람이 한다 (docs/adr/0001).
#   토 06:00 KST — 블로그 원고 PR(후보 5 + 1번 미리 렌더) + Threads 논평 ① PR(월 09:00 발행 예정)
#   목 06:00 KST — Threads 논평 ② PR(금 09:00 발행 예정)
#   → 일 20:00 슬롯에서 결정. 논평은 merge 해도 바로 안 나가고 publish-queue 가 그 날 09:00 에 낸다.
# 블로그 원고 PR 은:
#   PR 본문 맨 위 = 주제 후보 5개, 그 아래 = 1번으로 미리 렌더한 원고.
#   merge = 승인(블로그 즉시 게시 → review.yml 이 Threads 원고 PR 을 연다)
#   close = 반려 · 댓글 /변경 <지시> · /주제 N = 재생성 (review.yml)
#   결정이 없으면 보류 → 두 슬롯을 지나면 hold-timer.yml 이 자동 반려
# 채점 탈락 원고도 PR 로 올린다(라벨 탈락) — 사람이 /주제 로 그 주 글을 살릴 수 있게. 그래서 탈락은 빨간불이 아니다.
#
# GITHUB_TOKEN 이 만든 PR 은 봇 자신의 이벤트로는 워크플로를 깨우지 않지만, 사람의 merge·댓글은 깨운다
# (docs/research-2026-09-10.md §3). 그래서 검수 표면이 PR 이어도 된다.
#
# ⚠️ Secret: CLAUDE_CODE_OAUTH_TOKEN(필수) · TELEGRAM_BOT_TOKEN·TELEGRAM_CHAT_ID(없으면 알림만 생략)
on:
  schedule:
    - cron: "0 21 * * 5"   # 토 06:00 KST — 블로그 + 논평 ①
    - cron: "0 21 * * 3"   # 목 06:00 KST — 논평 ②
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = 목요일이면 논평만, 그 외엔 블로그 + 논평 ① · blog · thread"
        required: false
        default: auto
        type: choice
        options: [auto, blog, thread]
      topic:
        description: "글 주제 한 줄 (비우면 최신 다이제스트 후보 1번)"
        required: false
        type: string
      sources:
        description: "출처 URL 또는 repo 내 파일 경로, 공백으로 구분 (topic 을 줬을 때 필수)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 재실행은 트리거 시점의 github.sha 를 다시 체크아웃한다 — 같은 주제로 같은 slug 의 PR 을 하나 더 열 수 있다.
      # 아무것도 안 열렸으면 'Run workflow' 로 새로 돌려라.
      - name: 재실행 거부 (낡은 체크아웃)
        if: github.run_attempt != 1
        run: |
          echo "::error title=재실행 금지::재실행은 낡은 트리에서 같은 원고 PR 을 하나 더 연다. 'Run workflow' 로 새로 돌려라"
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Self-check
        run: |
          python scripts/grade.py --selftest
          python scripts/write_post.py --selftest
          python scripts/review_cmd.py --selftest
          python scripts/write_thread.py --selftest

      # 무엇을 만들지 + 논평 발행일. 목요일 실행은 금요일용 ②, 그 외(토 cron·수동)는 블로그 + 월요일용 ①
      - name: 모드
        id: mode
        env:
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          set -euo pipefail
          if [ "$MODE" = auto ]; then
            [ "$(TZ=Asia/Seoul date +%u)" = 4 ] && MODE=thread-fri || MODE=blog+thread
          fi
          case "$MODE" in
            thread-fri) BLOG=false; THREAD=true; ON=$(TZ=Asia/Seoul date -d 'next friday' +%F) ;;
            thread)     BLOG=false; THREAD=true; ON=$(TZ=Asia/Seoul date -d 'next monday' +%F) ;;
            blog)       BLOG=true;  THREAD=false; ON="" ;;
            *)          BLOG=true;  THREAD=true; ON=$(TZ=Asia/Seoul date -d 'next monday' +%F) ;;
          esac
          { echo "blog=$BLOG"; echo "thread=$THREAD"; echo "on=$ON"; } >> "$GITHUB_OUTPUT"
          echo "모드 $MODE — 블로그 $BLOG · 논평 $THREAD ${ON:+($ON 09:00 발행 예정)}"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # 주제를 안 줬을 때: 최신 digest/* 브랜치의 파일로 후보를 고른다.
      - name: Fetch latest digest branch
        if: inputs.topic == ''
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/digest/*:refs/remotes/origin/digest/*' || true
          LATEST=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/remotes/origin/digest/*' | head -1 || true)
          if [ -z "$LATEST" ]; then
            # 여기서 그냥 진행하면 main 에 추적돼 있는 낡은 digest/x-*.md 로 글을 써 버린다.
            echo "::error title=다이제스트 없음::digest/* 브랜치가 하나도 없다. daily-digest 가 도는지 확인해라"
            exit 1
          fi
          git checkout "$LATEST" -- digest/ && git reset -q digest/
          echo "다이제스트 브랜치 $LATEST 에서 digest/ 가져옴"

      - name: Write, grade, open review PR
        id: post
        if: steps.mode.outputs.blog == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ inputs.topic }}
          SOURCES: ${{ inputs.sources }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARGS=()
          if [ -n "${TOPIC:-}" ]; then
            ARGS+=(--topic "$TOPIC")
            for s in $SOURCES; do ARGS+=(--source "$s"); done
          else
            ARGS+=(--from-digest 1)
          fi
          python scripts/write_post.py "${ARGS[@]}" --publish | tee out.txt
          PR=$(grep -o 'https://github.com/[^ ]*/pull/[0-9]*' out.txt | tail -1 || true)
          VERDICT=$(grep -oE '^(PASS|FAIL) →' out.txt | head -1 | cut -d' ' -f1 || true)
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "verdict=${VERDICT:-?}" >> "$GITHUB_OUTPUT"
          [ -n "$PR" ] || { echo "::error title=PR 없음::원고 PR 이 열리지 않았다 — 위 로그를 보라"; exit 1; }
          { echo "note<<__NOTE__"; python scripts/pr_note.py "$PR" || echo "$PR"; echo "__NOTE__"; } >> "$GITHUB_OUTPUT"

      # 논평 ①②: 블로그가 고른 출처(열린 PR)와 이전 논평의 출처를 뺀 후보 1번. 탈락이어도 PR 로 올린다
      - name: 논평 원고 PR
        id: thread
        if: ${{ !cancelled() && steps.mode.outputs.thread == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ON: ${{ steps.mode.outputs.on }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/write_thread.py --from-digest 1 --publish-on "$ON" | tee t.txt || true
          F=$(grep -oE '^(PASS|FAIL) → drafts/threads/[^ ]+\.md' t.txt | head -1 | sed 's/.* → //' || true)
          [ -n "$F" ] || { echo "::error title=논평 없음::논평 원고가 안 만들어졌다 — 위 로그를 보라"; exit 1; }
          SLUG=$(basename "$F" .md); SLUG=${SLUG%.FAIL}
          URL=$(scripts/open_thread_pr.sh "$SLUG" "다이제스트 논평 ($ON 발행)")
          echo "pr=$URL" >> "$GITHUB_OUTPUT"
          echo "verdict=$( [[ "$F" == *.FAIL.md ]] && echo FAIL || echo PASS )" >> "$GITHUB_OUTPUT"
          { echo "note<<__NOTE__"; python scripts/pr_note.py "$URL" || echo "$URL"; echo "__NOTE__"; } >> "$GITHUB_OUTPUT"

      - name: Telegram (논평)
        if: ${{ !cancelled() && steps.thread.outputs.pr != '' }}
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: ${{ steps.thread.outputs.note }}

      - name: Telegram
        if: always() && steps.post.outputs.pr != ''
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: ${{ steps.post.outputs.note }}

      # 원고 PR 이 안 열렸으면 그 주 그 칸이 비다 — 침묵이 아니라 폰에 한 줄이 와야 한다 (한도·토큰·다이제스트 없음)
      - name: Telegram (실패)
        if: failure()
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: |
            [원고 만들기 실패] 이번 회차 원고가 일부 안 만들어졌다
            블로그 ${{ steps.post.outputs.pr != '' && '열림' || steps.mode.outputs.blog == 'true' && '안 열림' || '해당 없음' }} · 논평 ${{ steps.thread.outputs.pr != '' && '열림' || steps.mode.outputs.thread == 'true' && '안 열림' || '해당 없음' }}
            원인은 보통 한도·토큰·다이제스트다. 실행 기록:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
