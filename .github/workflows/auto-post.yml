name: auto-post

# 주제 + 출처 URL 을 주면 글을 생성·채점하고, 통과하면 PR 을 열어 바로 머지한다.
# 그다음 그 글로 Threads 초안을 만들어 채점 통과 시 발행한다.
#
# 게이트는 사람이 아니라 scripts/grade.py 다 — 결정론 검사(말투 7금지 + 지어낸 수치 대조)
# + LLM 이진 판정. 둘 다 통과 못 하면 drafts/ 에만 남고 아무것도 나가지 않는다.
#
# GITHUB_TOKEN 으로 만든 PR 은 pull_request 워크플로를 트리거하지 않는다
# (docs/research-2026-09-10.md §3). 그래서 채점·머지를 이 job 안에서 끝낸다.
#
# ⚠️ 최초 1회: CLAUDE_CODE_OAUTH_TOKEN(필수) · THREADS_TOKEN(없으면 DRY_RUN)
on:
  # 수요일 09:00 KST — 주제를 안 주면 최신 다이제스트 1번 항목으로 쓴다 (--from-digest 1)
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:
    inputs:
      topic:
        description: "글 주제 한 줄 (비우면 최신 다이제스트 1번 항목)"
        required: false
        type: string
      sources:
        description: "출처 URL 또는 repo 내 파일 경로, 공백으로 구분"
        required: false
        type: string
      merge:
        description: "채점 통과 시 즉시 머지"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Self-check
        run: |
          python scripts/grade.py --selftest
          python scripts/write_post.py --selftest
          python scripts/write_thread.py --selftest

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # 주제를 안 줬을 때: 다이제스트 PR 이 아직 안 머지됐어도 최신 digest/* 브랜치의 파일로 고른다.
      - name: Fetch latest digest branch
        if: inputs.topic == ''
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/digest/*:refs/remotes/origin/digest/*' || true
          LATEST=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/remotes/origin/digest/*' | head -1 || true)
          if [ -z "$LATEST" ]; then
            # 여기서 그냥 진행하면 main 에 추적돼 있는 낡은 digest/x-*.md 로 글을 써 버린다.
            # 조용한 성공 금지 — 재료가 없으면 글을 만들지 않는다.
            echo "::error title=다이제스트 없음::digest/* 브랜치가 하나도 없다. daily-digest 가 도는지 확인해라"
            exit 1
          fi
          git checkout "$LATEST" -- digest/ && git reset -q digest/
          echo "다이제스트 브랜치 $LATEST 에서 digest/ 가져옴"

      - name: Write, grade, publish post
        id: post
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ inputs.topic }}
          SOURCES: ${{ inputs.sources }}
          # `inputs` 는 workflow_dispatch 에서만 채워진다. schedule 로 돌면 null 이고
          # GitHub 표현식은 타입이 다르면 숫자로 캐스팅해(null→0, false→0)
          # `inputs.merge != false` 가 **false** 가 된다 — 2026-09-16 cron 로그에 `MERGE: false`.
          # 그러면 글은 머지 안 된 PR 에 갇히는데 스레드는 그대로 나가서 404 링크를 단다.
          MERGE: ${{ github.event_name != 'workflow_dispatch' || inputs.merge }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARGS=()
          if [ -n "${TOPIC:-}" ]; then
            ARGS+=(--topic "$TOPIC")
            for s in $SOURCES; do ARGS+=(--source "$s"); done
          else
            ARGS+=(--from-digest 1)
          fi
          [ "$MERGE" = "true" ] && ARGS+=(--merge)
          python scripts/write_post.py "${ARGS[@]}" --publish | tee out.txt
          SLUG=$(grep -o 'content/[^ ]*\.mdx' out.txt | head -1 || true)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "merged=$MERGE" >> "$GITHUB_OUTPUT"

      # 여기 오면 글은 이미 머지돼 사이트에 나갔다. 스레드가 채점에서 떨어진 것과
      # 발행이 중간에 끊긴 것은 심각도가 다른데 둘 다 exit 1 이라 워크플로가 똑같이
      # 빨간불이었다. 아래 판정 스텝에서 갈라 낸다.
      - name: Thread from post
        id: thread
        if: steps.post.outputs.slug != '' && steps.post.outputs.merged == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          SLUG: ${{ steps.post.outputs.slug }}
        run: python scripts/write_thread.py --post "$SLUG" --publish

      # 머지 안 한 실행(--merge 없이 dispatch)은 스레드를 안 낸다 — 글이 사이트에 없다
      - name: 머지 안 했으면 스레드 생략을 알린다
        if: steps.post.outputs.slug != '' && steps.post.outputs.merged != 'true'
        run: echo "::warning title=스레드 생략::머지하지 않아 글이 사이트에 없다. PR 을 머지한 뒤 publish-thread 워크플로로 스레드를 내라"

      # ponytail: 러너는 매번 새 체크아웃이고 .FAIL.md 는 git 에 없다 —
      # 파일이 있으면 이번 실행이 만든 것이다. 더 정확히 보려면 write_thread 가
      # 종료 코드를 나눠 줘야 하는데, 그건 이 한 줄보다 큰 변경이다.
      - name: 스레드 실패 갈라내기
        if: steps.thread.outcome == 'failure'
        run: |
          set -euo pipefail
          if compgen -G "drafts/threads/*.FAIL.md" > /dev/null; then
            echo "::warning title=스레드 채점 탈락::글은 게시됐고 스레드만 안 나갔다. 초안을 고쳐 publish-thread 워크플로의 draft 입력으로 재시도해라"
          else
            echo "::error title=스레드 발행 실패::채점 탈락이 아니다. 체인이 끊겼으면 로그의 '이어붙이기' 명령으로 이어 붙여라"
            exit 1
          fi

      - name: Keep thread draft
        if: always() && steps.thread.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: thread-draft
          path: drafts/threads/
          if-no-files-found: ignore
