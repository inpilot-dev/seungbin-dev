name: review

# 검수 표면 = GitHub PR (docs/adr/0001). 사람의 행동 넷에 반응한다.
#   ① 블로그 원고 PR merge   → Threads 원고를 만들어 채점하고 **또 PR 로** 올린다 (파생, 수시 검수)
#                              + card-news 레포에 덱을 요청한다 — 거기가 `원고:card` PR 을 이 레포로 보낸다 (증분 5)
#   ② Threads 원고 PR merge  → 라벨 `발행 대기` + 예정 시각 댓글. 발행은 publish-queue.yml 이 그 날 09:00 에 (증분 2)
#   ③ 카드뉴스 PR merge      → 라벨 `발행 대기` + 목 09:00 안내, 그리고 card-news 에 사진 장부를 적게 한다 (증분 5)
#   ④ 원고 PR 댓글 /변경·/주제 → 재생성해 같은 PR 브랜치에 밀어 넣고 결과를 댓글로 남긴다
# 저장소는 공개다 — 댓글 명령은 OWNER 만 받는다. 아니면 누구든 sonnet 생성을 돌릴 수 있다.
on:
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  derive:
    name: 블로그 승인 → Threads 원고 PR
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, '원고:blog')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 탈락 원고(drafts/)를 merge 한 경우엔 게시된 글이 없다 — 파생할 것도 없다
      - name: 머지된 글 찾기
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          F=$(gh pr view "$PR" --json files --jq '.files[].path' | grep -E '^content/.*\.mdx$' | head -1 || true)
          [ -n "$F" ] || echo "::notice title=파생 없음::content/ 글이 없는 PR 이다 (탈락 원고 merge 등)"
          echo "post=$F" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        if: steps.pick.outputs.post != ''
        run: npm install -g @anthropic-ai/claude-code

      # 블로그 기반 논평은 다음 수요일 09:00 에 나간다 (월 ① · 수 블로그 · 금 ②)
      - name: Threads 원고 생성 · 채점 · PR
        id: pr
        if: steps.pick.outputs.post != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          POST: ${{ steps.pick.outputs.post }}
          BLOG_PR: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ON=$(TZ=Asia/Seoul date -d 'next wednesday' +%F)
          SLUG=$(basename "$POST" .mdx)
          python scripts/write_thread.py --post "$POST" --publish-on "$ON" || echo "::warning title=스레드 채점 탈락::탈락 원고로 PR 을 연다"
          # 판정은 PR 을 열기 전에 — 스크립트가 원고를 thread 브랜치에 커밋하고 돌아오면 파일이 작업 트리에서 사라진다
          V=$( [ -f "drafts/threads/$SLUG.FAIL.md" ] && echo FAIL || echo PASS )
          URL=$(scripts/open_thread_pr.sh "$SLUG" "블로그 $BLOG_PR 의 파생 ($ON 발행)")
          { echo "url=$URL"; echo "on=$ON"; echo "verdict=$V"; } >> "$GITHUB_OUTPUT"

      # 카드뉴스만 다른 레포가 만든다 — 렌더러·Playwright·사진 장부가 card-news 에 있다(레포를 합치지 않는다).
      # 덱이 나오면 그쪽이 GH_PAT 으로 이 레포에 `원고:card` PR 을 연다. 10~30분 걸린다.
      # 스레드 생성이 실패해도 카드는 요청한다 — 둘은 독립된 파생이다
      - name: 카드뉴스 덱 요청 (card-news)
        if: ${{ !cancelled() && steps.pick.outputs.post != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.GH_PAT }}
          POST: ${{ steps.pick.outputs.post }}
        run: |
          set -euo pipefail
          SLUG=$(basename "$POST" .mdx)
          # frontmatter 파서는 이미 있다(grade.split_front) — YAML 을 다시 긁지 않는다
          TITLE=$(python -c "import sys;sys.path.insert(0,'scripts');import grade;print(grade.split_front(open(sys.argv[1],encoding='utf-8').read())[0].get('title',''))" "$POST")
          # 라벨은 PR 을 여는 쪽(card-news·GH_PAT)이 권한 때문에 못 만들 수 있다. 여기 토큰은 확실하다
          gh label create "원고:card" --force --color c98a00 \
            --description "카드뉴스 덱 PR — merge 하면 발행 대기, 목 09:00 에 인스타로 나간다" >/dev/null
          # gh api -f 는 client_payload 를 중첩해 주지 않는다 — 본문을 직접 만들어 넣는다
          jq -n --arg s "$SLUG" --arg t "$TITLE" --arg u "https://inpilot.dev/posts/$SLUG" \
            '{event_type:"card-news", client_payload:{slug:$s,title:$t,url:$u}}' \
            | GH_TOKEN="$PAT" gh api repos/inpilot-dev/card-news/dispatches --input -
          echo "::notice title=카드뉴스 요청::$SLUG — 10~30분 뒤 원고:card PR 이 열린다"

      - name: Telegram
        if: steps.pr.outputs.url != ''
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: |
            🧵 Threads 원고 PR — 채점 ${{ steps.pr.outputs.verdict }} (블로그 승인 파생 · ${{ steps.pr.outputs.on }} 09:00 발행 예정)
            merge=발행 대기 · close=반려
            ${{ steps.pr.outputs.url }}

  queued:
    name: Threads 승인 → 발행 대기
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, '원고:thread')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # 발행은 여기서 하지 않는다 — publish-queue.yml 이 사이드카 날짜 09:00 에 낸다. 여기선 사람에게 언제 나가는지만 알린다
      - name: 라벨 · 예정 댓글
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          D=$(gh pr view "$PR" --json files --jq '.files[].path' | grep -E '^drafts/threads/.*\.md$' | head -1 || true)
          if [ -z "$D" ] || [[ "$D" == *.FAIL.md ]]; then
            gh pr comment "$PR" --body "⚠️ 발행 안 됨 — 통과한 원고가 없다(\`${D:-없음}\`). 탈락 원고는 큐가 내지 않는다."
            exit 0
          fi
          ON=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["publish_on"])' "${D%.md}.json")
          # 발행 시각을 지나 merge 됐으면 큐가 이 원고를 안 낸다(그 주는 보류) — 나간다고 알리면 거짓말이다
          if [ "$(TZ=Asia/Seoul date +%s)" -ge "$(TZ=Asia/Seoul date -d "$ON 09:00" +%s)" ]; then
            gh pr comment "$PR" --body "⏸ 보류 — 발행 시각($ON 09:00 KST)이 지나 merge 됐다. 이번 주는 안 나간다. 꼭 내야 하면 publish-thread 워크플로에 \`$D\` 를 넣어 손으로 돌려라."
            exit 0
          fi
          gh label create "발행 대기" --force --color 00795f --description "승인됨 — 채널 시각에 publish-queue 가 낸다" >/dev/null
          gh pr edit "$PR" --add-label "발행 대기" >/dev/null
          gh pr comment "$PR" --body "🕘 발행 대기 — **$ON 09:00 KST** 에 publish-queue 가 낸다. 그 전에 빼려면 main 에서 \`$D\` 를 지워라."

  card:
    name: 카드뉴스 승인 → 발행 대기
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, '원고:card')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # 카드에는 사이드카 날짜가 없다 — publish_instagram 이 목요일에 '가장 오래된 미발행 덱' 하나를 낸다.
      # 그래서 날짜를 못 박지 않는다. 지킬 수 없는 약속을 댓글에 적지 않는 게 이 줄의 전부다
      - name: 라벨 · 안내 댓글
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.headRefName }}
        run: |
          set -euo pipefail
          SLUG=${BRANCH#card/}
          gh label create "발행 대기" --force --color 00795f --description "승인됨 — 채널 시각에 publish-queue 가 낸다" >/dev/null
          gh pr edit "$PR" --add-label "발행 대기" >/dev/null
          gh pr comment "$PR" --body "🕘 발행 대기 — 목 09:00 KST 에 publish-queue 가 **가장 오래된 미발행 덱 하나**를 낸다(카드는 사이드카 날짜가 없다). 앞에 대기 중인 덱이 있으면 그만큼 뒤로 밀린다. 그 전에 빼려면 main 에서 \`public/cards/$SLUG/\` 를 지워라."

      # 사진 장부(state/used-photos.json)는 card-news 에만 있다. 안 적으면 다음 덱에서 같은 사진이 나온다(SPEC 9).
      # 여기서 실패해도 발행은 그대로다 — 카드는 이미 main 에 있다. 그래서 warning 이지 error 가 아니다
      - name: 사진 장부 기록 요청 (card-news)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.GH_PAT }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          M=$(gh pr view "$PR" --json body --jq .body \
              | grep -oE '<!-- card slug=[a-z0-9-]+ deck=[0-9a-z-]+ run=[0-9]+ -->' | tail -1 || true)
          if [ -z "$M" ]; then
            echo "::warning title=덱 표식 없음::PR 본문에 card-news 표식이 없다. 사진 장부를 못 적는다 — card-news 의 approve 워크플로를 손으로 돌려라"
            exit 0
          fi
          read -r SLUG DECK RUN < <(sed -E 's/.*slug=([^ ]+) deck=([^ ]+) run=([0-9]+).*/\1 \2 \3/' <<<"$M")
          jq -n --arg s "$SLUG" --arg d "$DECK" --arg r "$RUN" \
            '{event_type:"card-approve", client_payload:{slug:$s,deck:$d,run:$r}}' \
            | GH_TOKEN="$PAT" gh api repos/inpilot-dev/card-news/dispatches --input -
          gh pr comment "$PR" --body "📒 사진 장부 — card-news 에 \`$DECK\` 승인을 요청했다(같은 사진이 다음 덱에서 안 나오게)."

  command:
    name: 댓글 /변경 · /주제
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request != null
      && github.event.comment.author_association == 'OWNER'
      && contains(github.event.issue.labels.*.name, '원고:blog')
      && (startsWith(github.event.comment.body, '/변경') || startsWith(github.event.comment.body, '/주제'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: 재생성
        id: regen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          # ${{ }} 를 run 본문에 끼우면 스크립트 인젝션이다. env 를 거치면 셸이 값으로만 본다.
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          gh pr view "$PR" --json body --jq .body > pr_body.md
          git fetch origin "$BRANCH"
          # PR 의 변경 파일은 GitHub 이 안다. 로컬 diff 는 shallow clone 이라 merge-base 가 없고,
          # 두 점 diff 는 그사이 main 에 머지된 남의 글을 "삭제" 로 오판한다.
          MDX=$(gh pr view "$PR" --json files --jq '.files[].path' | grep -E '^(content|drafts)/[^/]+\.mdx$' | head -1 || true)
          if [ -n "$MDX" ]; then git show "origin/$BRANCH:$MDX" > cur.mdx; SLUG=$(basename "$MDX" .mdx); else : > cur.mdx; SLUG="post"; fi
          set +e
          python scripts/review_cmd.py run --comment "$COMMENT" --pr-body pr_body.md --mdx cur.mdx --mdx-path "$MDX" --slug "$SLUG" --onto "$BRANCH" 2>&1 | tee out.txt
          RC=${PIPESTATUS[0]}
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          {
            case "$RC" in
              0) echo "✅ 재생성 통과 — 이 PR 브랜치를 갱신했다. 파일 탭에서 확인하고 merge(승인) 또는 close(반려)";;
              1) echo "⚠️ 재생성했지만 채점 탈락 — 브랜치에 탈락 원고가 올라갔다. \`/변경\` 으로 한 번 더 지시하거나 \`/주제 N\` 으로 바꿔라";;
              3) grep '^REJECT:' out.txt | sed 's/^REJECT: /❌ /';;
              *) echo "❌ 재생성 실패 (exit $RC) — 실행 로그를 보라";;
            esac
            echo; echo '<details><summary>로그</summary>'; echo; echo '```'; tail -40 out.txt; echo '```'; echo '</details>'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
          # /주제 로 출처가 바뀌었으면 review_cmd 가 pr_body.md 의 `← 이번 원고` 를 옮겨 뒀다 — 본문에 반영해야
          # 다음 실행의 중복 제외(write_post.queued_urls)가 새 출처를 안다 (2026-09-18 #42·#59)
          if [ "$RC" = 0 ] || [ "$RC" = 1 ]; then gh pr edit "$PR" --body-file pr_body.md >/dev/null; fi
          # 라벨 정리: 통과면 탈락 라벨을 떼고, 탈락이면 붙인다
          if [ "$RC" = 0 ]; then gh pr edit "$PR" --remove-label "탈락" 2>/dev/null || true; fi
          if [ "$RC" = 1 ]; then gh pr edit "$PR" --add-label "탈락" 2>/dev/null || true; fi
      - name: Telegram
        if: always()
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: |
            ${{ steps.regen.outputs.rc == '0' && '✅ 재생성 통과' || steps.regen.outputs.rc == '1' && '⚠️ 재생성 탈락' || '❌ 재생성 거부/실패' }} — PR #${{ github.event.issue.number }}
            ${{ github.event.issue.html_url }}
