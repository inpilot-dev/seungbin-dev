name: post-drafts

# 새 글이 main 에 올라오면 SNS 초안을 만들어 PR 로 연다.
# daily-digest 와 같은 모양이다 — 기계가 초안까지, 고르는 건 사람.
# 여기서도 발행은 하지 않는다. 발행은 publish-threads.yml 이 머지 후에 한다.
#
# 초안 생성에 `claude -p`(Haiku)를 쓴다. CLAUDE_CODE_OAUTH_TOKEN 이 없으면
# 이 워크플로는 조용히 아무것도 안 하고 끝난다 (digest 와 같은 정책).
on:
  push:
    branches: [main]
    paths: ["content/**.mdx"]
  workflow_dispatch:
    inputs:
      file:
        description: "초안을 만들 .mdx 경로 (수동 테스트용)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: post-drafts
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # 직전 커밋과 비교해 "새로 추가된" 글만 고른다

      - name: Pick new posts
        id: pick
        env:
          MANUAL: ${{ inputs.file }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL:-}" ]; then
            FILES="$MANUAL"
          else
            # 수정(M)이 아니라 추가(A)만. 오타 고칠 때마다 초안이 다시 나오면 안 된다.
            FILES=$(git diff --name-only --diff-filter=A HEAD^ HEAD -- 'content/**.mdx' || true)
          fi
          if [ -z "$FILES" ]; then
            echo "새 글 없음 — 종료"
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            echo "대상: $FILES"
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code CLI
        if: steps.pick.outputs.files != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate drafts
        if: steps.pick.outputs.files != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ${{ }} 를 run 본문에 직접 끼워넣으면 스크립트 인젝션이 된다.
          # env 를 거치면 셸이 값으로만 취급한다.
          FILES: ${{ steps.pick.outputs.files }}
        run: |
          set -euo pipefail
          if ! command -v claude >/dev/null; then
            echo "::warning::claude CLI 없음 — 초안 생성 건너뜀"; exit 0
          fi
          mkdir -p drafts

          # 말투 규칙은 docs/ 에 있고 docs/ 는 .gitignore 대상이라 CI 에 없을 수 있다.
          # 있으면 쓰고 없으면 그 사실을 프롬프트에 명시한다 — 조용히 무시하면
          # "톤을 맞췄다"고 착각하게 된다.
          if [ -f docs/voice.md ]; then
            VOICE=$(cat docs/voice.md)
          else
            VOICE="(말투 규칙 파일 없음 — 톤은 원문 자체에서 추론할 것)"
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            SLUG=$(basename "$f" .mdx)
            OUT="drafts/${SLUG}.md"
            echo "초안 생성: $f → $OUT"

            {
              printf '%s\n' "다음은 내 기술 블로그 글이다. 이 글을 SNS 재발행용 초안으로 바꿔라."
              printf '%s\n' ""
              printf '%s\n' "## 내 말투 규칙"
              printf '%s\n' "$VOICE"
              printf '%s\n' ""
              printf '%s\n' "## 원문"
              cat "$f"
              printf '%s\n' ""
              printf '%s\n' "## 만들 것 (이 순서, 이 형식의 마크다운으로만 출력)"
              printf '%s\n' "1. '## 후킹 첫 두 줄 10개' — 번호 목록. 각 항목은 두 줄 이내."
              printf '%s\n' "   패턴을 섞어라: 숫자로 시작 / 손실 고백 / 통념 뒤집기 / 장면 묘사."
              printf '%s\n' "2. '## Threads 초안' — 500자 이내 1건. 위 훅 중 하나로 시작할 것."
              printf '%s\n' "3. '## 한 문장 카피' — 3개."
              printf '%s\n' "4. '## 인용할 문장' — 원문에서 **그대로** 3개. 지어내지 말 것."
              printf '%s\n' ""
              printf '%s\n' "제약: 원문에 없는 사실·수치를 만들지 마라. 이모지·느낌표 금지."
              printf '%s\n' "각 항목은 사람이 고를 후보다. 하나로 좁히지 마라."
            } > /tmp/prompt.txt

            if claude -p --model claude-haiku-4-5 < /tmp/prompt.txt > "$OUT"; then
              # 앞머리에 출처와 게이트를 박아둔다 — 이 파일만 보고도 규칙을 알 수 있게
              printf '%s\n' "# ${SLUG} — SNS 초안" \
                "" \
                "> 출처: \`${f}\` · 자동 생성(claude -p)" \
                "> **고르고 다듬은 뒤 쓴다. 그대로 올리지 않는다.**" \
                "" | cat - "$OUT" > "$OUT.tmp" && mv "$OUT.tmp" "$OUT"
            else
              echo "::warning::$f 초안 생성 실패 — 건너뜀"
              rm -f "$OUT"
            fi
          done <<< "$FILES"

      - name: Open PR
        if: steps.pick.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain drafts/ 2>/dev/null)" ]; then
            echo "생성된 초안 없음 — PR 생략"; exit 0
          fi
          BRANCH="drafts/$(TZ=Asia/Seoul date +%F-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add drafts/
          git commit -m "chore(drafts): SNS 초안 자동 생성"
          git push -u origin "$BRANCH"
          gh pr create --title "drafts: $(TZ=Asia/Seoul date +%F)" --body \
            "새 글에서 뽑은 SNS 초안. **고르고 다듬은 뒤** 쓴다 — 그대로 올리지 않는다.
          발행은 이 PR 이 아니라 digest 쪽 파이프라인(publish-threads.yml)이 담당한다."
