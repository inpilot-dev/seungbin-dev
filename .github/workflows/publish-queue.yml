name: publish-queue

# 승인된(main 에 merge 된) Threads 원고를 채널 시각에 낸다 — 월·수·금 09:00 KST (증분 2, 2026-09-18).
#   월 = 다이제스트 논평 ① · 수 = 블로그 기반 · 금 = 논평 ②. 날짜는 원고 사이드카 publish_on 이 정한다.
#   대상 고르기·장부는 scripts/publish_queue.py. 장부(drafts/threads/.published.json)를 main 에 커밋한다 —
#   vercel.json ignoreCommand 가 drafts/ 만 바뀐 커밋은 배포하지 않는다.
# ⚠️ Secret: THREADS_TOKEN(없으면 DRY — 무엇이 나갈지만 찍고 장부는 안 쓴다) · TELEGRAM_*(없으면 알림 생략)
on:
  schedule:
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발행 없이 오늘 낼 원고만 찍는다"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 재실행은 낡은 체크아웃이라 장부에 방금 적은 것을 모른다 → 같은 체인이 두 번 나간다
      - name: 재실행 거부 (중복 발행)
        if: github.run_attempt != 1
        run: |
          echo "::error title=재실행 금지::재실행은 장부를 모르는 낡은 트리다. 'Run workflow' 로 새로 돌려라"
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-check
        run: python scripts/publish_queue.py --selftest
      - name: 발행
        id: pub
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -euo pipefail
          set +e; python scripts/publish_queue.py 2>&1 | tee out.txt; RC=${PIPESTATUS[0]}; set -e
          # 알릴 게 있을 때만(발행·실패·보류) — 빈 날까지 울리면 알림이 소음이 된다
          if grep -qE '^(발행|FAIL|보류|DRY) ' out.txt || grep -q '링크:' out.txt; then
            { echo "msg<<EOF"; grep -E '^(발행|FAIL|보류|DRY) |링크:|이어붙이기:' out.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi
          exit "$RC"
      - name: 장부 커밋
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git add drafts/threads/.published.json 2>/dev/null || true
          git diff --cached --quiet && { echo "장부 변경 없음"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "ledger: Threads 발행 $(TZ=Asia/Seoul date +%F)"
          git push -q origin HEAD:main
      - name: Telegram
        if: ${{ !cancelled() && (steps.pub.outputs.msg != '' || failure()) }}
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: |
            ${{ steps.pub.outcome == 'failure' && '❌ publish-queue 실패' || '📤 publish-queue' }}
            ${{ steps.pub.outputs.msg }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
